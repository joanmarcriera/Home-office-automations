name: Daily Jules Maintenance

on:
  # Scheduled runs come from odd-day-pipeline.yml, after the digest-to-intake
  # bridge. One pass per odd day: the old 19:00 second pass could only act
  # once the morning "Daily Maintenance Run - <date>" issue was resolved, and
  # that is exactly when jules-pipeline-trigger.yml re-dispatches this lane
  # (on every Jules PR merge), so a second clock-driven pass is redundant.
  workflow_call:
  workflow_dispatch: # allow manual trigger for testing

concurrency:
  group: daily-jules-maintenance
  cancel-in-progress: false

jobs:
  open-maintenance-issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure jules label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! gh api "repos/$REPO/labels/jules" >/dev/null 2>&1; then
            gh label create "jules" \
              --repo "$REPO" \
              --color "1f6feb" \
              --description "Issues queued for Jules automation"
          fi

      - name: Quarantine failed Jules issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: python3 scripts/quarantine_failed_jules_issues.py

      - name: Check for open Jules PRs (throttle)
        id: throttle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Count only LIVE (non-CONFLICTING) Jules PRs. A permanently-conflicting
          # orphan can never merge, so counting it would stall this lane forever —
          # the pipeline would silently stop producing work. pr-hygiene.yml closes
          # such orphans separately.
          CANDIDATES=$(gh pr list \
            --repo "$REPO" \
            --state open \
            --json number,title,body,labels,headRefName,author \
            --jq '[.[] | select(
              (.title | test("daily maintenance|daily knowledge|weekly|cross-link|primer|automated resolution|freshness audit"; "i")) or
              ((.body // "") | test("PR created automatically by Jules"; "i")) or
              (.labels[]?.name == "jules") or
              (.headRefName | test("jules|daily-maintenance|daily-knowledge|jules-sprint|weekly-deepen|cross-link|primer|auto-fix|ralph-loop|freshness-audit|audit-batch|batch-"; "i")) or
              (.author.login == "google-labs-jules[bot]")
            ) | .number]')

          OPEN_PRS=0
          for PR in $(echo "$CANDIDATES" | jq -r '.[]'); do
            STATE=$(gh pr view "$PR" --repo "$REPO" --json mergeable --jq '.mergeable' 2>/dev/null || echo UNKNOWN)
            if [ "$STATE" = "CONFLICTING" ]; then
              echo "Ignoring conflicting orphan PR #$PR for throttle."
              continue
            fi
            OPEN_PRS=$((OPEN_PRS + 1))
          done

          echo "open_prs=$OPEN_PRS" >> "$GITHUB_OUTPUT"
          if [ "$OPEN_PRS" != "0" ]; then
            echo "⏸️ Throttled: $OPEN_PRS live Jules PR(s). Skipping issue creation."
          fi

      - name: Check for existing open maintenance issue today
        if: steps.throttle.outputs.open_prs == '0'
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          TODAY=$(date +%Y-%m-%d)
          EXISTING=$(gh issue list \
            --repo "$REPO" \
            --label jules \
            --state open \
            --search "Daily Maintenance Run" \
            --json title \
            --jq "[.[] | select(.title | contains(\"$TODAY\"))] | length")
          echo "existing=$EXISTING" >> "$GITHUB_OUTPUT"
          echo "today=$TODAY" >> "$GITHUB_OUTPUT"

      - name: Open Jules maintenance issue
        if: steps.throttle.outputs.open_prs == '0' && steps.check.outputs.existing == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TODAY: ${{ steps.check.outputs.today }}
        run: |
          set -euo pipefail
          cp .github/issue-templates/daily-jules-maintenance.md issue_body.md

          gh issue create \
            --repo "$REPO" \
            --title "Daily Maintenance Run - $TODAY" \
            --label jules \
            --body-file issue_body.md

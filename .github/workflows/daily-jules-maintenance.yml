name: Daily Jules Maintenance

on:
  # Scheduled runs come from odd-day-pipeline.yml, after the digest-to-intake
  # bridge. One pass per odd day: the old 19:00 second pass could only act
  # once the morning "Daily Maintenance Run - <date>" issue was resolved, and
  # that is exactly when jules-pipeline-trigger.yml re-dispatches this lane
  # (on every Jules PR merge), so a second clock-driven pass is redundant.
  workflow_call:
    inputs:
      dry_run:
        description: Report only — no issues, PRs, labels or comments are written
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report only — no issues, PRs, labels or comments are written
        type: boolean
        default: false

concurrency:
  group: daily-jules-maintenance
  cancel-in-progress: false

jobs:
  open-maintenance-issue:
    runs-on: ubuntu-latest
    env:
      DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
    permissions:
      contents: read # checkout
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Dry-run guard (intercept mutating gh calls)
        if: env.DRY_RUN == 'true'
        run: bash scripts/ci/install_gh_dry_run_shim.sh

      - name: Ensure jules label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! gh api "repos/$REPO/labels/jules" >/dev/null 2>&1; then
            gh label create "jules" \
              --repo "$REPO" \
              --color "1f6feb" \
              --description "Issues queued for Jules automation"
          fi

      - name: Quarantine failed Jules issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: python3 scripts/quarantine_failed_jules_issues.py

      - name: Check for open Jules PRs (throttle)
        id: throttle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Count only LIVE (non-CONFLICTING) Jules PRs. A permanently-conflicting
          # orphan can never merge, so counting it would stall this lane forever —
          # the pipeline would silently stop producing work. pr-hygiene.yml closes
          # such orphans separately.
          # Trusted identity first (owner/known bots, not a fork) — a look-alike
          # PR from anyone else must not throttle this lane. See
          # scripts/ci/trusted_actor.py; a lookup error fails the step.
          CANDIDATES=$(gh pr list \
            --repo "$REPO" \
            --state open \
            --limit 200 \
            --json number,title,body,labels,headRefName,author,isCrossRepository \
            | python3 scripts/ci/trusted_actor.py prs --bot-heuristic \
            | jq -c 'map(.number)')

          OPEN_PRS=0
          for PR in $(echo "$CANDIDATES" | jq -r '.[]'); do
            STATE=$(gh pr view "$PR" --repo "$REPO" --json mergeable --jq '.mergeable' 2>/dev/null || echo UNKNOWN)
            if [ "$STATE" = "CONFLICTING" ]; then
              echo "Ignoring conflicting orphan PR #$PR for throttle."
              continue
            fi
            OPEN_PRS=$((OPEN_PRS + 1))
          done

          echo "open_prs=$OPEN_PRS" >> "$GITHUB_OUTPUT"
          if [ "$OPEN_PRS" != "0" ]; then
            echo "⏸️ Throttled: $OPEN_PRS live Jules PR(s). Skipping issue creation."
          fi

      - name: Check for existing open maintenance issue today
        if: steps.throttle.outputs.open_prs == '0'
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TODAY=$(date +%Y-%m-%d)
          # Only today's control issue opened by a trusted actor counts. A
          # lookup error now fails the step (watchdog reports it) instead of
          # leaving `existing` empty and skipping silently.
          EXISTING=$(gh issue list \
            --repo "$REPO" \
            --label jules \
            --state open \
            --search "Daily Maintenance Run" \
            --json number,title,author \
            | python3 scripts/ci/trusted_actor.py issues \
            | jq --arg today "$TODAY" '[.[] | select((.title | startswith("Daily Maintenance Run - ")) and (.title | contains($today)))] | length')
          echo "existing=$EXISTING" >> "$GITHUB_OUTPUT"
          echo "today=$TODAY" >> "$GITHUB_OUTPUT"

      - name: Open Jules maintenance issue
        if: steps.throttle.outputs.open_prs == '0' && steps.check.outputs.existing == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TODAY: ${{ steps.check.outputs.today }}
        run: |
          set -euo pipefail
          # Render (not cp): expands $TODAY and pins the run date for the agent.
          python3 scripts/render_issue_template.py .github/issue-templates/daily-jules-maintenance.md issue_body.md --date "$TODAY"

          gh issue create \
            --repo "$REPO" \
            --title "Daily Maintenance Run - $TODAY" \
            --label jules \
            --body-file issue_body.md

name: Scheduled Jules Maintenance
on:
  schedule:
    - cron: '0 0,8,16 1-31/2 * *' # 00:00/08:00/16:00 UTC on odd days only (alternate-day cadence, 2026-09-25)
  workflow_dispatch:

concurrency:
  group: scheduled-jules-maintenance
  cancel-in-progress: false

jobs:
  jules-watch:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Jules Issue Watcher
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/jules_issue_watcher.py

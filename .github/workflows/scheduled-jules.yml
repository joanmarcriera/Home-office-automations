name: Scheduled Jules Maintenance
on:
  # Scheduled runs come from odd-day-pipeline.yml (one pass per odd day, before
  # Process Jules Backlog so newly labelled issues are counted). The watcher is
  # idempotent (it skips issues already labelled `jules`), so the former
  # 00:00/08:00/16:00 triple pass only re-scanned the same issues.
  workflow_call:
    inputs:
      dry_run:
        description: Report only — no issues, PRs, labels or comments are written
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report only — no issues, PRs, labels or comments are written
        type: boolean
        default: false

concurrency:
  group: scheduled-jules-maintenance
  cancel-in-progress: false

jobs:
  jules-watch:
    runs-on: ubuntu-latest
    env:
      DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
    permissions:
      issues: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Dry-run guard (intercept mutating gh calls)
        if: env.DRY_RUN == 'true'
        run: bash scripts/ci/install_gh_dry_run_shim.sh

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Jules Issue Watcher
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/jules_issue_watcher.py

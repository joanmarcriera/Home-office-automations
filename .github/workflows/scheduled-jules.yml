name: Scheduled Jules Maintenance
on:
  # Scheduled runs come from odd-day-pipeline.yml (one pass per odd day, before
  # Process Jules Backlog so newly labelled issues are counted). The watcher is
  # idempotent (it skips issues already labelled `jules`), so the former
  # 00:00/08:00/16:00 triple pass only re-scanned the same issues.
  workflow_call:
  workflow_dispatch:

concurrency:
  group: scheduled-jules-maintenance
  cancel-in-progress: false

jobs:
  jules-watch:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Jules Issue Watcher
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/jules_issue_watcher.py

name: Jules Pipeline — Next Issue After Merge

# After a Jules PR merges, the pipeline is clear for the next issue.
# This workflow triggers the appropriate daily issue-creation workflow
# so Jules can pick up work without waiting for the next cron tick.

on:
  pull_request:
    types: [closed]

permissions:
  issues: write
  actions: write

jobs:
  trigger-next:
    # Only run when a Jules-related PR is merged (not just closed)
    if: >-
      github.event.pull_request.merged == true && (
        contains(github.event.pull_request.title, 'daily maintenance') ||
        contains(github.event.pull_request.title, 'daily knowledge') ||
        contains(github.event.pull_request.title, 'weekly') ||
        contains(github.event.pull_request.title, 'cross-link') ||
        contains(github.event.pull_request.title, 'primer') ||
        contains(github.event.pull_request.title, 'automated resolution') ||
        contains(github.event.pull_request.body || '', 'PR created automatically by Jules') ||
        github.event.pull_request.user.login == 'google-labs-jules[bot]'
      )
    runs-on: ubuntu-latest
    steps:
      # Even UTC days of the month are deliberately job-free (see CLAUDE.md gotcha #5):
      # a PR merged on an even day waits for the next odd-day pipeline run instead.
      - name: Odd-day gate
        id: gate
        run: |
          if [ $(( $(date -u +%-d) % 2 )) -eq 1 ]; then
            echo "odd=true" >> "$GITHUB_OUTPUT"
          else
            echo "Even UTC day - skipping post-merge trigger; the next odd-day pipeline run picks up."
            echo "odd=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for main to settle
        if: steps.gate.outputs.odd == 'true'
        run: sleep 30

      - name: Trigger next maintenance workflow
        if: steps.gate.outputs.odd == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          echo "Jules PR merged — triggering next issue creation cycle."
          gh workflow run "Daily Jules Maintenance" --repo "$REPO" || true

      - name: Trigger next knowledge workflow
        if: steps.gate.outputs.odd == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh workflow run "Daily Jules Knowledge Expansion" --repo "$REPO" || true

      - name: Trigger backlog workflow
        if: steps.gate.outputs.odd == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh workflow run "Process Jules Backlog" --repo "$REPO" || true

      - name: Trigger cleanup workflow
        if: steps.gate.outputs.odd == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh workflow run "Cleanup Stale Automation Issues" --repo "$REPO" || true

name: Daily Jules Knowledge Expansion

on:
  # Scheduled runs come from odd-day-pipeline.yml (odd days only).
  workflow_call:
    inputs:
      dry_run:
        description: Report only — no issues, PRs, labels or comments are written
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report only — no issues, PRs, labels or comments are written
        type: boolean
        default: false

concurrency:
  group: daily-jules-knowledge
  cancel-in-progress: false

jobs:
  open-knowledge-issue:
    runs-on: ubuntu-latest
    env:
      DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
    permissions:
      contents: read # checkout
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Dry-run guard (intercept mutating gh calls)
        if: env.DRY_RUN == 'true'
        run: bash scripts/ci/install_gh_dry_run_shim.sh

      - name: Ensure jules label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! gh api "repos/$REPO/labels/jules" >/dev/null 2>&1; then
            gh label create "jules" \
              --repo "$REPO" \
              --color "1f6feb" \
              --description "Issues queued for Jules automation"
          fi

      - name: Quarantine failed Jules issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: python3 scripts/quarantine_failed_jules_issues.py

      - name: Check for open Jules PRs (throttle)
        id: throttle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Count only LIVE (non-CONFLICTING) Jules PRs. A permanently-conflicting
          # orphan can never merge, so counting it would stall this lane forever —
          # the pipeline would silently stop producing work. pr-hygiene.yml closes
          # such orphans separately.
          # Trusted identity first (owner/known bots, not a fork) — a look-alike
          # PR from anyone else must not throttle this lane. See
          # scripts/ci/trusted_actor.py; a lookup error fails the step.
          CANDIDATES=$(gh pr list \
            --repo "$REPO" \
            --state open \
            --limit 200 \
            --json number,title,body,labels,headRefName,author,isCrossRepository \
            | python3 scripts/ci/trusted_actor.py prs --limit 200 --bot-heuristic \
            | jq -c 'map(.number)')

          OPEN_PRS=0
          for PR in $(echo "$CANDIDATES" | jq -r '.[]'); do
            STATE=$(gh pr view "$PR" --repo "$REPO" --json mergeable --jq '.mergeable' 2>/dev/null || echo UNKNOWN)
            if [ "$STATE" = "CONFLICTING" ]; then
              echo "Ignoring conflicting orphan PR #$PR for throttle."
              continue
            fi
            OPEN_PRS=$((OPEN_PRS + 1))
          done

          echo "open_prs=$OPEN_PRS" >> "$GITHUB_OUTPUT"
          if [ "$OPEN_PRS" != "0" ]; then
            echo "⏸️ Throttled: $OPEN_PRS live Jules PR(s). Skipping issue creation."
          fi

      - name: Check queue status for knowledge issue creation
        if: steps.throttle.outputs.open_prs == '0'
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TODAY=$(date -u +%Y-%m-%d)
          SLOT=$(date -u +%H%M)

          # Existing daily knowledge automation issues (any date), opened by a
          # trusted actor — an outsider's look-alike must not pause this lane.
          # A lookup error fails the step (watchdog reports it).
          OPEN_KNOWLEDGE=$(gh issue list \
            --repo "$REPO" \
            --label jules \
            --state open \
            --search "Daily Knowledge Expansion -" \
            --limit 200 \
            --json number,title,author \
            | python3 scripts/ci/trusted_actor.py issues --limit 200 \
            | jq '[.[] | select(.title | startswith("Daily Knowledge Expansion - "))] | length')

          echo "open_knowledge=$OPEN_KNOWLEDGE" >> "$GITHUB_OUTPUT"
          echo "today=$TODAY" >> "$GITHUB_OUTPUT"
          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"

          if [ "$OPEN_KNOWLEDGE" != "0" ]; then
            echo "⏸️ Skipping daily expansion: existing open Daily Knowledge Expansion issue detected."
          fi

      - name: Open Jules knowledge issue
        if: steps.throttle.outputs.open_prs == '0' && steps.check.outputs.open_knowledge == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TODAY: ${{ steps.check.outputs.today }}
          SLOT: ${{ steps.check.outputs.slot }}
        run: |
          set -euo pipefail
          # Render (not cp): expands $TODAY and pins the run date for the agent.
          python3 scripts/render_issue_template.py .github/issue-templates/daily-jules-knowledge.md issue_body.md --date "$TODAY"

          gh issue create \
            --repo "$REPO" \
            --title "Daily Knowledge Expansion - $TODAY $SLOT UTC" \
            --label jules \
            --body-file issue_body.md

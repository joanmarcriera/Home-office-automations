name: Jules Sprint Workforce (2 Weeks)

on:
  schedule:
    - cron: "0 */4 * * *" # every 4 hours
  workflow_dispatch:

concurrency:
  group: jules-sprint-workers
  cancel-in-progress: false

jobs:
  seed-worker-issues:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    env:
      REPO: ${{ github.repository }}
      SPRINT_START: "2026-03-22"
      SPRINT_END: "2026-06-07"
      TARGET_WORKERS: "9"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure labels exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for LABEL in jules jules-sprint; do
            if ! gh api "repos/$REPO/labels/$LABEL" >/dev/null 2>&1; then
              if [ "$LABEL" = "jules" ]; then
                gh label create "$LABEL" --repo "$REPO" --color "1f6feb" --description "Issues queued for Jules automation"
              else
                gh label create "$LABEL" --repo "$REPO" --color "6f42c1" --description "2-week autonomous sprint work items for Jules"
              fi
            fi
          done

      - name: Quarantine failed Jules issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/quarantine_failed_jules_issues.py

      - name: Check sprint window
        id: window
        run: |
          set -euo pipefail
          TODAY=$(date -u +%F)
          echo "today=$TODAY" >> "$GITHUB_OUTPUT"
          if [[ "$TODAY" < "$SPRINT_START" || "$TODAY" > "$SPRINT_END" ]]; then
            echo "in_window=false" >> "$GITHUB_OUTPUT"
            echo "Outside sprint window ($SPRINT_START .. $SPRINT_END)."
          else
            echo "in_window=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for pending non-automation Jules issues
        if: steps.window.outputs.in_window == 'true'
        id: backlog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          OPEN_NON_AUTOMATION=$(gh issue list \
            --repo "$REPO" \
            --label jules \
            --state open \
            --json title,labels \
            --jq '[.[] | select(
              (.title | startswith("Daily Knowledge Expansion - ") | not) and
              (.title | startswith("Daily Maintenance Run - ") | not) and
              (.title | startswith("Process Jules Backlog - ") | not) and
              (.labels | any(.name == "jules-sprint") | not)
            )] | length')
          echo "open_non_automation=$OPEN_NON_AUTOMATION" >> "$GITHUB_OUTPUT"
          if [ "$OPEN_NON_AUTOMATION" != "0" ]; then
            echo "⏸️ Non-automation Jules backlog detected ($OPEN_NON_AUTOMATION). Sprint seeding skipped."
          fi

      - name: Check for live Jules PRs (throttle)
        if: steps.window.outputs.in_window == 'true' && steps.backlog.outputs.open_non_automation == '0'
        id: pr_throttle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Like the other Jules lanes: don't seed a sprint while real PRs are in
          # flight, and ignore CONFLICTING orphans so they can't stall seeding.
          # Without this, a sprint could flood the Jules daily quota with up to
          # TARGET_WORKERS issues regardless of how much work is already open.
          CANDIDATES=$(gh pr list \
            --repo "$REPO" \
            --state open \
            --json number,title,body,labels,headRefName,author \
            --jq '[.[] | select(
              (.title | test("daily maintenance|daily knowledge|weekly|cross-link|primer|automated resolution|freshness audit"; "i")) or
              ((.body // "") | test("PR created automatically by Jules"; "i")) or
              (.labels[]?.name == "jules") or
              (.headRefName | test("jules|daily-maintenance|daily-knowledge|jules-sprint|weekly-deepen|cross-link|primer|auto-fix|ralph-loop|freshness-audit|audit-batch|batch-"; "i")) or
              (.author.login == "google-labs-jules[bot]")
            ) | .number]')

          OPEN_PRS=0
          for PR in $(echo "$CANDIDATES" | jq -r '.[]'); do
            STATE=$(gh pr view "$PR" --repo "$REPO" --json mergeable --jq '.mergeable' 2>/dev/null || echo UNKNOWN)
            if [ "$STATE" = "CONFLICTING" ]; then
              echo "Ignoring conflicting orphan PR #$PR for throttle."
              continue
            fi
            OPEN_PRS=$((OPEN_PRS + 1))
          done

          echo "open_prs=$OPEN_PRS" >> "$GITHUB_OUTPUT"
          if [ "$OPEN_PRS" != "0" ]; then
            echo "⏸️ Throttled: $OPEN_PRS live Jules PR(s). Sprint seeding skipped."
          fi

      - name: Seed/maintain sprint worker issues
        if: steps.window.outputs.in_window == 'true' && steps.backlog.outputs.open_non_automation == '0' && steps.pr_throttle.outputs.open_prs == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/open_jules_sprint_issues.py \
            --repo "$REPO" \
            --target-workers "$TARGET_WORKERS"

name: Process Jules Backlog

on:
  # Scheduled runs come from odd-day-pipeline.yml (after the hygiene lanes and
  # the Jules issue watcher, so the backlog count is current).
  workflow_call:
    inputs:
      dry_run:
        description: Report only — no issues, PRs, labels or comments are written
        type: boolean
        default: false
  issues:
    types: [opened, reopened, labeled]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report only — no issues, PRs, labels or comments are written
        type: boolean
        default: false

jobs:
  open-backlog-issue:
    if: >-
      github.event_name != 'issues' ||
          (
        github.event_name == 'issues' && (
          github.event.action == 'opened' ||
          github.event.action == 'reopened' ||
          (github.event.action == 'labeled' && (github.event.label.name == 'jules' || github.event.label.name == 'jules-blocked'))
        )
      )
    # Job-level (not workflow-level) concurrency: a workflow-level group is
    # joined by EVERY triggered run, including the many event runs whose job is
    # skipped by the `if:` above, and GitHub keeps only one pending run per
    # group — a burst of skipped event runs could cancel the pipeline's queued
    # sweep. A job-level group is only entered by runs that actually execute.
    concurrency:
      group: process-jules-backlog
      cancel-in-progress: false
    runs-on: ubuntu-latest
    env:
      DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
    permissions:
      contents: read # checkout
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Dry-run guard (intercept mutating gh calls)
        if: env.DRY_RUN == 'true'
        run: bash scripts/ci/install_gh_dry_run_shim.sh

      - name: Ensure jules label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! gh api "repos/$REPO/labels/jules" >/dev/null 2>&1; then
            gh label create "jules" \
              --repo "$REPO" \
              --color "1f6feb" \
              --description "Issues queued for Jules automation"
          fi

      - name: Quarantine failed Jules issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: python3 scripts/quarantine_failed_jules_issues.py

      - name: Check for open Jules PRs (throttle)
        id: throttle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # List candidate bot PRs, then exclude permanently-CONFLICTING orphans
          # from the throttle count. A conflicting orphan can never merge, so
          # counting it would jam the pipeline forever (the bug that produced the
          # June 2026 21-PR pileup). pr-hygiene.yml closes those separately.
          # Trusted identity first (owner/known bots, not a fork) — a look-alike
          # PR from anyone else must not throttle this lane. See
          # scripts/ci/trusted_actor.py; a lookup error fails the step.
          CANDIDATES=$(gh pr list \
            --repo "$REPO" \
            --state open \
            --limit 200 \
            --json number,title,body,labels,headRefName,author,isCrossRepository \
            | python3 scripts/ci/trusted_actor.py prs --limit 200 --bot-heuristic \
            | jq -c 'map(.number)')

          OPEN_PRS=0
          for PR in $(echo "$CANDIDATES" | jq -r '.[]'); do
            STATE=$(gh pr view "$PR" --repo "$REPO" --json mergeable --jq '.mergeable' 2>/dev/null || echo UNKNOWN)
            if [ "$STATE" = "CONFLICTING" ]; then
              echo "Ignoring conflicting orphan PR #$PR for throttle."
              continue
            fi
            OPEN_PRS=$((OPEN_PRS + 1))
          done

          echo "open_prs=$OPEN_PRS" >> "$GITHUB_OUTPUT"
          if [ "$OPEN_PRS" != "0" ]; then
            echo "⏸️ Throttled: $OPEN_PRS live (non-conflicting) Jules PR(s). Skipping backlog issue creation."
          fi

      - name: Check open Jules backlog status
        if: steps.throttle.outputs.open_prs == '0'
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TODAY=$(date +%Y-%m-%d)
          NON_CONTROL_FILTER='[.[] | select(
            (.title | startswith("Process Jules Backlog - ") | not) and
            (.title | startswith("Daily Knowledge Expansion - ") | not) and
            (.title | startswith("Daily Maintenance Run - ") | not) and
            (.title | startswith("[W") | not)
          )] | length'

          OPEN_JULES=$(gh issue list \
            --repo "$REPO" \
            --label jules \
            --state open \
            --json number,title \
            --jq "$NON_CONTROL_FILTER")
          OPEN_BLOCKED=$(gh issue list \
            --repo "$REPO" \
            --label jules-blocked \
            --state open \
            --json number,title \
            --jq "$NON_CONTROL_FILTER")
          # Only a control issue opened by a trusted actor counts: an outsider's
          # look-alike title must not suppress the backlog issue.
          OPEN_BACKLOG=$(gh issue list \
            --repo "$REPO" \
            --state open \
            --search "Process Jules Backlog -" \
            --limit 200 \
            --json number,title,author \
            | python3 scripts/ci/trusted_actor.py issues --limit 200 \
            | jq '[.[] | select(.title | startswith("Process Jules Backlog - "))] | length')

          OPEN_WORK=$((OPEN_JULES + OPEN_BLOCKED))

          echo "open_work=$OPEN_WORK" >> "$GITHUB_OUTPUT"
          echo "open_blocked=$OPEN_BLOCKED" >> "$GITHUB_OUTPUT"
          echo "open_jules=$OPEN_JULES" >> "$GITHUB_OUTPUT"
          echo "open_backlog=$OPEN_BACKLOG" >> "$GITHUB_OUTPUT"
          echo "today=$TODAY" >> "$GITHUB_OUTPUT"

          if [ "$OPEN_WORK" = "0" ]; then
            echo "No open Jules or Jules-blocked backlog items."
          fi
          if [ "$OPEN_BACKLOG" != "0" ]; then
            echo "Existing Process Jules Backlog issue already open."
          fi

      - name: Open Jules backlog issue
        if: steps.throttle.outputs.open_prs == '0' && steps.check.outputs.open_work != '0' && steps.check.outputs.open_backlog == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TODAY: ${{ steps.check.outputs.today }}
        run: |
          set -euo pipefail
          # Render (not cp): expands $TODAY and pins the run date for the agent.
          python3 scripts/render_issue_template.py .github/issue-templates/process-jules-backlog.md issue_body.md --date "$TODAY"
          
          gh issue create \
            --repo "$REPO" \
            --title "Process Jules Backlog - $TODAY" \
            --label jules \
            --body-file issue_body.md

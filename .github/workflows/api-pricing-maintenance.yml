name: API Pricing Maintenance

on:
  # Scheduled runs come from odd-day-pipeline.yml on days 1,7,13,19,25 of the
  # month, chained directly after the Weekly Growth Planner.
  workflow_call:
    inputs:
      dry_run:
        description: Report only — no issues, PRs, labels or comments are written
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report only — no issues, PRs, labels or comments are written
        type: boolean
        default: false

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  # Shared queue because multiple scheduled lanes update the same weekly rollup PR branch.
  group: automation-rollup-producer
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the pending-rollup merge below has a base

      - name: Dry-run guard (intercept mutating gh calls)
        if: env.DRY_RUN == 'true'
        run: bash scripts/ci/install_gh_dry_run_shim.sh

      - name: Preserve pending rollup work
        # See weekly-planner.yml for the rationale: without this merge, a lane
        # with no changes of its own resets the shared rollup branch to main
        # and closes the PR, discarding other lanes' pending work.
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch origin automation/weekly-rollup 2>/dev/null; then
            if git merge --no-edit FETCH_HEAD; then
              echo "Merged pending rollup work from automation/weekly-rollup."
            else
              git merge --abort
              echo "::warning::Pending rollup branch conflicts with main; continuing from clean main."
            fi
          else
            echo "No pending rollup branch to preserve."
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Regenerate capability summaries
        run: python3 scripts/update_api_pricing_capability_summary.py

      - name: Check pricing-doc freshness
        id: freshness
        run: |
          python3 scripts/check_doc_freshness.py \
            docs/knowledge_base/api_pricing_free_tiers.md \
            --max-days 21 \
            --github-output "$GITHUB_OUTPUT"

      - name: Run knowledge quality checks
        run: |
          python3 scripts/check_docs_contract.py docs/knowledge_base/api_pricing_free_tiers.md
          python3 scripts/check_catalog_consistency.py

      - name: Create pull request for generated updates
        # Never on a branch test or a dry run: this pushes the shared rollup branch.
        if: github.ref_name == 'main' && env.DRY_RUN != 'true'
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/weekly-rollup
          delete-branch: true
          title: "chore: automation rollup"
          commit-message: "chore(pricing): refresh capability capacity summaries"
          body: |
            Automated weekly rollup for repository-maintenance changes.

            This shared PR is refreshed by the scheduled automation lanes during the week and merged by the weekly rollup workflow after it syncs with `main` and re-runs the required checks.
          add-paths: |
            docs/knowledge_base/api_pricing_free_tiers.md

      - name: Trigger PR gate workflows
        if: github.ref_name == 'main' && (steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_BRANCH: ${{ steps.cpr.outputs.pull-request-branch }}
          BASE_SHA: ${{ github.sha }}
          HEAD_SHA: ${{ steps.cpr.outputs.pull-request-head-sha }}
        run: |
          python3 scripts/dispatch_pr_gate_workflows.py \
            --repo "$REPO" \
            --ref "$PR_BRANCH" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA"

      - name: Open stale-review issue if needed
        if: steps.freshness.outputs.stale_any == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REPORT: ${{ steps.freshness.outputs.freshness_report }}
        run: |
          set -euo pipefail
          if ! gh api "repos/$REPO/labels/jules" >/dev/null 2>&1; then
            gh label create "jules" \
              --repo "$REPO" \
              --color "1f6feb" \
              --description "Issues queued for Jules automation"
          fi

          # Only an alert opened by a trusted actor counts: an outsider's
          # look-alike must not suppress it (scripts/ci/trusted_actor.py).
          EXISTING=$(gh issue list \
            --repo "$REPO" \
            --state open \
            --search "Pricing Matrix Freshness" \
            --json number,title,author \
            | python3 scripts/ci/trusted_actor.py issues \
            | jq '[.[] | select(.title | startswith("Pricing Matrix Freshness"))] | length')

          if [ "$EXISTING" != "0" ]; then
            echo "Freshness issue already open."
            exit 0
          fi

          BODY=$(cat <<'EOF'
          ## API Pricing Matrix Freshness Alert

          The weekly pricing-maintenance workflow detected stale review metadata.

          ### Report
          ```
          __REPORT__
          ```

          ### Action
          - Re-verify provider pricing and free-tier claims from official docs.
          - Update `Last reviewed` and evidence summaries.
          - Regenerate capability summaries with:
            `python3 scripts/update_api_pricing_capability_summary.py`
          EOF
          )
          BODY="${BODY/__REPORT__/$REPORT}"

          gh issue create \
            --repo "$REPO" \
            --title "Pricing Matrix Freshness - action required" \
            --label "jules" \
            --body "$BODY"

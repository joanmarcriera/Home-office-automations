name: Cleanup Stale Automation Issues

on:
  schedule:
    - cron: "20 1 * * *" # Daily at 01:20 UTC
  workflow_dispatch:

concurrency:
  group: cleanup-automation-issues
  cancel-in-progress: false

jobs:
  close-stale-control-issues:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Close stale auto-generated control issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          TO_CLOSE=$(gh issue list \
            --repo "$REPO" \
            --state open \
            --label jules \
            --author "app/github-actions" \
            --limit 200 \
            --json number,title,createdAt \
            --jq '
              def family:
                if (.title | startswith("Daily Maintenance Run -")) then "daily-maintenance"
                elif (.title | startswith("Daily Knowledge Expansion -")) then "daily-knowledge"
                elif (.title | startswith("Process Jules Backlog -")) then "process-backlog"
                elif (.title | startswith("Category gap fill:")) then "category-gap-fill"
                elif (.title | startswith("Weekly deepening:")) then "weekly-deepening"
                elif (.title | startswith("Weekly cross-link fix:")) then "weekly-cross-link"
                else empty
                end;
              map(select(.title | test("^(Daily Maintenance Run -|Daily Knowledge Expansion -|Process Jules Backlog -|Category gap fill:|Weekly deepening:|Weekly cross-link fix:)"))
                  | . + {family: family})
              | group_by(.family)
              | map(sort_by(.createdAt) | reverse | .[1:] | .[]?.number)
              | flatten
              | .[]')

          if [ -z "${TO_CLOSE:-}" ]; then
            echo "No superseded automation issues to close."
            exit 0
          fi

          for n in $TO_CLOSE; do
            gh issue close "$n" \
              --repo "$REPO" \
              --comment "Superseded by a newer automation control issue; closing automatically."
            echo "Closed superseded automation issue #$n"
          done

      - name: Close stale singleton control issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          STALE_DAYS: '10'
        run: |
          set -euo pipefail

          # The step above only closes WITHIN-family duplicates (keeps newest).
          # A lone control issue that is never acted on (e.g. a "Daily Maintenance
          # Run" with no resulting work) would otherwise live forever. Expire any
          # auto-generated control issue older than STALE_DAYS regardless of count.
          CUTOFF=$(date -u -d "-${STALE_DAYS} days" +%s)

          STALE=$(gh issue list \
            --repo "$REPO" \
            --state open \
            --label jules \
            --author "app/github-actions" \
            --limit 200 \
            --json number,title,createdAt \
            --jq '[.[]
              | select(.title | test("^(Daily Maintenance Run -|Daily Knowledge Expansion -|Process Jules Backlog -|Weekly cross-link fix:)"))
              | {number, createdAt}]')

          CHECKED=$(echo "$STALE" | jq 'length')
          echo "Evaluated $CHECKED open control issue(s) against the ${STALE_DAYS}-day threshold."

          CLOSED=0
          # Process substitution (not a pipe) so the loop runs in this shell and
          # the counter survives for the summary line below.
          while read -r row; do
            n=$(echo "$row" | jq -r '.number')
            created=$(echo "$row" | jq -r '.createdAt')
            created_ts=$(date -u -d "$created" +%s 2>/dev/null || echo 0)
            if [ "$created_ts" -lt "$CUTOFF" ] && [ "$created_ts" != "0" ]; then
              age=$(( ( $(date -u +%s) - created_ts ) / 86400 ))
              if gh issue close "$n" \
                --repo "$REPO" \
                --comment "Auto-closed: stale automation control issue (idle ${age} days, threshold ${STALE_DAYS}). No resulting work; closing to keep the queue clean."; then
                echo "Closed stale control issue #$n (${age}d old)"
                CLOSED=$((CLOSED + 1))
              else
                echo "WARNING: failed to close #$n (continuing)"
              fi
            fi
          done < <(echo "$STALE" | jq -c '.[]')

          echo "Stale-singleton sweep complete: closed $CLOSED of $CHECKED control issue(s)."

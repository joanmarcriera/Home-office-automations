name: Digest to Intake Bridge

on:
  # Scheduled runs come from odd-day-pipeline.yml, directly after the Daily AI
  # Digest (it reads the digest committed to the rollup branch).
  workflow_call:
    inputs:
      dry_run:
        description: Report only — no issues, PRs, labels or comments are written
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report only — no issues, PRs, labels or comments are written
        type: boolean
        default: false

concurrency:
  # Shared queue because multiple scheduled lanes update the same weekly rollup PR branch.
  group: automation-rollup-producer
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  bridge:
    runs-on: ubuntu-latest
    env:
      DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the pending-rollup merge below has a base

      - name: Dry-run guard (intercept mutating gh calls)
        if: env.DRY_RUN == 'true'
        run: bash scripts/ci/install_gh_dry_run_shim.sh

      - name: Preserve pending rollup work
        # See weekly-planner.yml for the rationale. This lane was the actual
        # killer Apr-Jul 2026: it usually has nothing to bridge, so it reset
        # the shared branch to main and closed the rollup PR every day,
        # discarding the digest committed an hour earlier.
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch origin automation/weekly-rollup 2>/dev/null; then
            if git merge --no-edit FETCH_HEAD; then
              echo "Merged pending rollup work from automation/weekly-rollup."
            else
              git merge --abort
              echo "::warning::Pending rollup branch conflicts with main; continuing from clean main."
            fi
          else
            echo "No pending rollup branch to preserve."
          fi

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install openai

      - name: Run bridge script
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python scripts/digest_to_intake.py

      - name: Create pull request for intake updates
        # Never on a branch test or a dry run: this pushes the shared rollup branch.
        if: github.ref_name == 'main' && env.DRY_RUN != 'true'
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          # Same real-identity token as the other rollup producers: a push with
          # GITHUB_TOKEN leaves the rollup PR's pull_request checks stuck at
          # action_required. See .github/automation-token-setup.md.
          token: ${{ secrets.AUTOMATION_PAT || secrets.GITHUB_TOKEN }}
          branch: automation/weekly-rollup
          delete-branch: true
          title: "chore: automation rollup"
          commit-message: "chore(intake): bridge digest sources"
          body: |
            Automated weekly rollup for repository-maintenance changes.

            This shared PR is refreshed by the scheduled automation lanes during the week and merged by the weekly rollup workflow after it syncs with `main` and re-runs the required checks.
          add-paths: |
            docs/new-sources.md
            docs/new-sources/**

      - name: Trigger PR gate workflows
        if: github.ref_name == 'main' && (steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_BRANCH: ${{ steps.cpr.outputs.pull-request-branch }}
          BASE_SHA: ${{ github.sha }}
          HEAD_SHA: ${{ steps.cpr.outputs.pull-request-head-sha }}
        run: |
          python3 scripts/dispatch_pr_gate_workflows.py \
            --repo "$REPO" \
            --ref "$PR_BRANCH" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA"

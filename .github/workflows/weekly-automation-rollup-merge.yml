name: Weekly Automation Rollup Merge

on:
  schedule:
    # Hourly 18:15-23:15 UTC on days 1,7,13,19,25 (odd days only, ~weekly) —
    # the evening after odd-day-pipeline.yml ran the growth/pricing producers.
    # Kept as its own cron rather than a chained job: the retries need
    # wall-clock spacing for the rollup checks to finish and auto-merge to land.
    - cron: "15 18-23 1,7,13,19,25 * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report only — no push to the rollup branch, no dispatches, no auto-merge
        type: boolean
        default: false

concurrency:
  group: automation-rollup-merge
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  merge-rollup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Push the sync merge with the same real-identity token the producers
          # use, so the PR's pull_request checks start normally instead of
          # sitting at action_required (GITHUB_TOKEN pushes need approval).
          token: ${{ secrets.AUTOMATION_PAT || secrets.GITHUB_TOKEN }}

      - name: Dry-run guard (intercept mutating gh calls)
        if: env.DRY_RUN == 'true'
        run: bash scripts/ci/install_gh_dry_run_shim.sh

      - name: Find open rollup PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          PR_NUMBER=$(gh pr list \
            --repo "$REPO" \
            --state open \
            --head automation/weekly-rollup \
            --json number \
            --jq '.[0].number // ""')

          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

          if [ -z "$PR_NUMBER" ]; then
            echo "No open weekly automation rollup PR."
          else
            echo "Found rollup PR #$PR_NUMBER."
          fi

      - name: Sync rollup branch with main
        if: steps.pr.outputs.number != ''
        id: sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main automation/weekly-rollup
          BASE_SHA=$(git rev-parse origin/main)

          git checkout -B automation/weekly-rollup origin/automation/weekly-rollup
          git merge --no-edit origin/main
          if [ "$DRY_RUN" = "true" ]; then
            echo "[dry-run] would push $(git rev-parse --short HEAD) to automation/weekly-rollup"
          else
            git push origin HEAD:automation/weekly-rollup
          fi

          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Trigger required checks for rollup PR
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ steps.sync.outputs.base_sha }}
          HEAD_SHA: ${{ steps.sync.outputs.head_sha }}
        run: |
          python3 scripts/dispatch_pr_gate_workflows.py \
            --repo "$REPO" \
            --ref automation/weekly-rollup \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA"

      - name: Let GitHub register refreshed checks
        if: steps.pr.outputs.number != ''
        run: sleep 20

      - name: Enable rollup PR auto-merge
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          gh pr merge "$PR_NUMBER" \
            --repo "$REPO" \
            --merge \
            --auto \
            --delete-branch \
            --body "Weekly automation rollup refreshed against main, required checks dispatched, and auto-merge enabled."

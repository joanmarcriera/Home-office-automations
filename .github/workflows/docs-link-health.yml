name: Docs Link Health

on:
  pull_request:
  # Scheduled runs come from odd-day-pipeline.yml on days 5,11,17,23,29 of the
  # month (offset from the other weekly lanes).
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check markdown links
        uses: lycheeverse/lychee-action@v2.9.0 # pinned: floating v2 setup failed to download lychee (curl 35) on 2026-09-25
        with:
          lycheeVersion: latest
          args: --config .github/lychee.toml "docs/**/*.md" "README.md" "skills.md"
          fail: false
          jobSummary: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

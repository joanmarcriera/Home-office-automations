name: Automation Health Watchdog

# Observability + transient-failure recovery for the unattended pipeline.
# Scans every scheduled lane (discovered from cron triggers, so new lanes are
# covered automatically), auto-reruns a failed run's failed jobs once, and
# maintains ONE singleton `automation-health` issue: opened/updated while
# lanes fail or stall, closed automatically when everything is green.

on:
  # Chained, not clocked: runs as soon as the odd-day pipeline finishes, so it
  # judges the settled pipeline (odd days only) and can rerun that run's failed
  # jobs straight away. The rerun completing triggers one more scan, which
  # reports "already rerun once" instead of rerunning again — no loop.
  # workflow_run only fires from the default branch.
  workflow_run:
    workflows: ["Odd-Day Automation Pipeline"]
    types: [completed]
    branches: [main]
  # Dead-man's switch: workflow_run only fires if the pipeline runs at all. If
  # its schedule stops (disabled workflow, broken YAML, GitHub pausing crons),
  # nothing would ever report it — so also scan on a slow clock of its own
  # (odd days, ~weekly, midday so it never races the 00:30 pipeline).
  schedule:
    - cron: "45 12 3,11,19,27 * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report only (no reruns, no issue writes)
        type: boolean
        default: false

permissions:
  contents: read
  actions: write # gh run rerun
  issues: write

concurrency:
  group: automation-health
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run health scan
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then
            python3 scripts/automation_health.py --dry-run
          else
            python3 scripts/automation_health.py
          fi

name: Weekly Growth Planner

on:
  schedule:
    - cron: "0 2 * * 1"  # Monday 02:00 UTC — single weekly run
  workflow_dispatch:

concurrency:
  # Shared queue because multiple scheduled lanes update the same weekly rollup PR branch.
  group: automation-rollup-producer
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the pending-rollup merge below has a base

      - name: Preserve pending rollup work
        # Producers share the automation/weekly-rollup branch, but
        # peter-evans/create-pull-request rebuilds it from main on every run —
        # a lane arriving with no changes of its own would otherwise reset the
        # branch, see zero diff, and close the shared PR, silently discarding
        # the other lanes' pending work (this killed the pipeline Apr-Jul 2026).
        # Merging the pending branch first makes every lane additive.
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch origin automation/weekly-rollup 2>/dev/null; then
            if git merge --no-edit FETCH_HEAD; then
              echo "Merged pending rollup work from automation/weekly-rollup."
            else
              git merge --abort
              echo "::warning::Pending rollup branch conflicts with main; continuing from clean main."
            fi
          else
            echo "No pending rollup branch to preserve."
          fi

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install openai

      - name: Run growth tracker
        run: python scripts/growth_tracker.py

      - name: Update source scores
        run: python scripts/update_source_scores.py

      - name: Create weekly issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/weekly_planner.py

      - name: Create pull request for weekly metrics
        if: github.ref_name == 'main'
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          # Use a real-identity PAT (or GitHub App token) so the resulting PR
          # TRIGGERS the on:pull_request check workflows. PRs opened with the
          # default GITHUB_TOKEN are intentionally inert (GitHub recursion guard),
          # which leaves checks stuck in "action_required". Falls back to
          # GITHUB_TOKEN when the secret is absent (PR still opens; the
          # "Trigger PR gate workflows" step below dispatches checks manually).
          token: ${{ secrets.AUTOMATION_PAT || secrets.GITHUB_TOKEN }}
          branch: automation/weekly-rollup
          delete-branch: true
          title: "chore: automation rollup"
          commit-message: "chore: weekly growth snapshot"
          body: |
            Automated weekly rollup for repository-maintenance changes.

            This shared PR is refreshed by the scheduled automation lanes during the week and merged by the weekly rollup workflow after it syncs with `main` and re-runs the required checks.
          add-paths: |
            data/growth-metrics.json
            data/source-scores.json

      - name: Trigger PR gate workflows
        if: github.ref_name == 'main' && (steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_BRANCH: ${{ steps.cpr.outputs.pull-request-branch }}
          BASE_SHA: ${{ github.sha }}
          HEAD_SHA: ${{ steps.cpr.outputs.pull-request-head-sha }}
        run: |
          python3 scripts/dispatch_pr_gate_workflows.py \
            --repo "$REPO" \
            --ref "$PR_BRANCH" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA"
